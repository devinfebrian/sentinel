<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative">
<!-- Atmospheric Subtle Background Decoration -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container opacity-20 blur-3xl rounded-full"></div>

<!-- Main Content Container (Suppressed Shell as per instructions for Transactional flow) -->
<main class="relative z-10 w-full max-w-[480px] animate-in fade-in zoom-in duration-700">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-lg">
<div class="mb-sm flex items-center justify-center w-14 h-14 bg-primary rounded-xl shadow-lg">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-background tracking-tight">Eleva</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-xs px-md">
                Pintu gerbang menuju pembelajaran modern yang lebih baik.
            </p>
</div>
<!-- Change Password Card -->
<div class="tonal-layer-1 rounded-lg border border-[#A6C5D6] shadow-[0px_10px_30px_rgba(32,33,36,0.05)] p-md md:p-lg transition-all">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Ubah Kata Sandi</h2>
<div class="flex items-start gap-3 bg-tertiary-container/30 p-sm rounded-lg border border-tertiary-container">
<span class="material-symbols-outlined text-tertiary text-[20px]">info</span>
<p class="font-label-lg text-on-tertiary-container leading-relaxed">
                        Silakan ubah kata sandi Anda untuk pertama kali demi keamanan akun.
                    </p>
</div>
</div>
<form action="#" class="space-y-md" method="POST" onsubmit="event.preventDefault(); alert('Kata sandi berhasil diperbarui!');">
<!-- Current Password Field -->
<div class="space-y-xs group">
<label class="font-label-lg text-label-lg text-on-surface-variant group-focus-within:text-primary transition-colors" for="current-password">Current Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px]">lock_open</span>
<input class="w-full pl-10 pr-10 py-3 bg-[#F5F5F4] border-b-2 border-outline-variant focus:outline-none focus:border-primary transition-all font-body-md text-body-md text-on-surface placeholder:text-outline" id="current-password" name="current-password" placeholder="Kata sandi saat ini" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" onclick="togglePassword('current-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- New Password Field -->
<div class="space-y-xs group">
<label class="font-label-lg text-label-lg text-on-surface-variant group-focus-within:text-primary transition-colors" for="new-password">New Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-[#F5F5F4] border-b-2 border-outline-variant focus:outline-none focus:border-primary transition-all font-body-md text-body-md text-on-surface placeholder:text-outline" id="new-password" name="new-password" placeholder="Kata sandi baru" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" onclick="togglePassword('new-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex gap-1 mt-2">
<div class="h-1 flex-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-error w-1/3 transition-all duration-500"></div>
</div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
<p class="font-label-sm text-label-sm text-outline">Gunakan minimal 8 karakter dengan kombinasi angka dan simbol.</p>
</div>
<!-- Confirm New Password Field -->
<div class="space-y-xs group">
<label class="font-label-lg text-label-lg text-on-surface-variant group-focus-within:text-primary transition-colors" for="confirm-password">Confirm New Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px]">verified_user</span>
<input class="w-full pl-10 pr-10 py-3 bg-[#F5F5F4] border-b-2 border-outline-variant focus:outline-none focus:border-primary transition-all font-body-md text-body-md text-on-surface placeholder:text-outline" id="confirm-password" name="confirm-password" placeholder="Konfirmasi kata sandi baru" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" onclick="togglePassword('confirm-password', this)" type="button">

</button>

                        Simpan &amp; Lanjutkan

</button>
</div>

</div>

<script>
        function togglePassword(id, button) {
            const input = document.getElementById(id);
            const icon = button.querySelector('.material-symbols-outlined');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Lightweight password strength logic
        const newPassInput = document.getElementById('new-password');
        const strengthBar = document.querySelector('.bg-error');

        newPassInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length === 0) {
                strengthBar.style.width = '0%';
            } else if (val.length < 6) {
                strengthBar.style.width = '33%';
                strengthBar.className = 'h-full bg-error transition-all duration-500';
            } else if (val.length < 10) {
                strengthBar.style.width = '66%';
                strengthBar.className = 'h-full bg-tertiary transition-all duration-500';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'h-full bg-primary transition-all duration-500';
            }
        });
    </script>
